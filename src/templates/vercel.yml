# Vercel Production Deployment Specification
version: 2
framework: vite
buildCommand: npm run build
outputDirectory: dist
routes:
  - src: "/api/(.*)"
    dest: "/api/$1"
  - src: "/(.*)"
    dest: "/index.html"
headers:
  - source: "/(.*)"
    headers:
      - key: "X-Frame-Options"
        value: "ALLOWALL"
      - key: "Access-Control-Allow-Origin"
        value: "*"
