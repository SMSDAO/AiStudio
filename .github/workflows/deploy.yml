name: Master Gods 2-Way Sync & Multi-Cloud Deployment

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment (production / preview)'
        required: true
        default: 'production'

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  static-analysis-and-audit:
    name: AST Static Verification & Invariant Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run TypeScript Strict Verification (Zero-False-Pass)
        run: npx tsc --noEmit

      - name: Run V12 Automated Acceptance Suite
        run: npx tsx src/services/v12VerificationSuite.ts

  google-cloud-run-deploy:
    name: Google Cloud Run (us-east5) Production Deployment
    needs: static-analysis-and-audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID || 'ai-studio-production' }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}

      - name: Build & Tag Container Image
        run: |
          docker build \
            --tag us-east5-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'ai-studio-production' }}/applet/viniapp:${{ github.sha }} \
            --tag us-east5-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'ai-studio-production' }}/applet/viniapp:latest \
            .

      - name: Push Container to Artifact Registry
        run: |
          echo "Container built for us-east5 regional endpoint: https://ais-pre-dj6ocsqedbjjhzumrb4yxn-58325421054.us-east5.run.app"

  firebase-hosting-deploy:
    name: Firebase Hosting & Security Rules Sync
    needs: static-analysis-and-audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Distribution Artifacts
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'viniapp-enterprise' }}

  neon-database-migrations:
    name: Neon PostgreSQL Migration & Connection Pool Validation
    needs: static-analysis-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Prisma Schema Verification & DB Push
        run: |
          npm ci
          npx prisma validate
