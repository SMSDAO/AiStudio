    language: "TypeScript 5.6 (Strict Mode)"
    styling: "Tailwind CSS v4 + Cyber Neon Glassmorphism Design System"
    components: "FlashGlowCard, GlassComponentLibrary, Lucide Icons, Canvas Confetti"
  backend:
    api: "Typed Express / Edge API Handlers with Zod Validation"
    orm: "Prisma 5.x / Drizzle ORM"
    database: "PostgreSQL 16 / Cloud SQL developer instance"
    realtime: "Supabase Realtime (build_logs channel) + PartyKit WebSockets"
  security:
    auth: "Google OAuth 2.0 (Client-side Bearer PKCE) + Web3 Wallet Signer"
    rbac:
      roles:
        - "PLATFORM_SUPER_ADMIN"
        - "ORG_OWNER"
        - "ORG_ADMIN"
        - "APP_OWNER"
        - "BUILDER"
        - "VIEWER"
    encryption: "RS256 JWT, Ed25519 Signers, AES-256 masked key storage"

