name: Miniapp CI/CD & Multi-Platform Verifier

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Check
        run: npm run lint

      - name: Validate Farcaster Frame v2 Manifest
        run: |
          if [ -f "farcaster.json" ]; then
            echo "Validating farcaster.json format..."
            cat farcaster.json
          fi

      - name: Build Miniapp
        run: npm run build

      - name: Deploy to Vercel (Edge)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Triggering Vercel deployment webhook for Base Miniapp..."
